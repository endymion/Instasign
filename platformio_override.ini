[platformio]
default_envs = seengreat_rgb_matrix_s3, esp32c3dev

[env:seengreat_rgb_matrix_s3]
extends = env:esp32s3dev_16MB_opi
upload_speed = 115200
; Keep WLED scripts (dynarray usermod registration, etc.) and overlay mbedTLS libs.
extra_scripts =
  ${scripts_defaults.extra_scripts}
  pre:scripts/install_mbedtls_tls.py
; Keep a single WLED_RELEASE_NAME (from parent env). Redefining breaks hybrid IDF
; rebuilds that compile wpa_supplicant with -Werror.
build_flags = ${env:esp32s3dev_16MB_opi.build_flags} ${hub75.build_flags} ${hub75.s3_build_flags} ${hub75.i2s_disable_flags}
  -D WLED_DEBUG
  -D RLYPIN=-1
  -D LEDPIN=-1
  -D IRPIN=-1
  -D AUDIOPIN=-1
  -D USERMOD_MATRIX_DISPLAY
  -D SEENGREAT_RGB_MATRIX_S3_PINOUT
lib_deps = 
  ${esp32s3.lib_deps}
  ${hub75.lib_deps}
  knolleary/PubSubClient@^2.8
; Re-enable mbedTLS client TLS + PEM parse (Tasmota stubs omit both) for AWS IoT MQTT.
custom_sdkconfig =
  '# CONFIG_MBEDTLS_TLS_DISABLED is not set'
  CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  CONFIG_MBEDTLS_PEM_PARSE_C=y

; DIAGNOSTIC ONLY: same hardware bus (HUB75 pinout) as seengreat_rgb_matrix_s3, but without
; the matrix_display usermod, to test whether WLED's own default boot color reaches the panel
; via the core HUB75 bus driver alone. Not meant to be kept long-term.
[env:seengreat_rgb_matrix_s3_diag]
extends = env:esp32s3dev_16MB_opi
upload_speed = 115200
extra_scripts =
  ${scripts_defaults.extra_scripts}
  pre:scripts/install_mbedtls_tls.py
build_flags = ${env:esp32s3dev_16MB_opi.build_flags} ${hub75.build_flags} ${hub75.s3_build_flags} ${hub75.i2s_disable_flags}
  -D WLED_DEBUG
  -D RLYPIN=-1
  -D LEDPIN=-1
  -D IRPIN=-1
  -D AUDIOPIN=-1
  -D SEENGREAT_RGB_MATRIX_S3_PINOUT
lib_deps =
  ${esp32s3.lib_deps}
  ${hub75.lib_deps}
  knolleary/PubSubClient@^2.8
custom_sdkconfig =
  '# CONFIG_MBEDTLS_TLS_DISABLED is not set'
  CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  CONFIG_MBEDTLS_PEM_PARSE_C=y

; online_lookup: ESP32-C3 space-launch clock (Launch Library 2 -> LED matrix)
; Uses the standard esp32c3 platform (Tasmota-patched, same as the rest of this repo) rather
; than a separate registry espressif32 core -- mixing cores pulls in an incompatible NeoPixelBus
; RMT driver version.
;
; Does NOT use custom_sdkconfig: on this chip it triggers a full CMake/ESP-IDF hybrid
; rebuild that (for reasons unrelated to mbedTLS) fails to register wled00/ as a source
; component at all, breaking the entire build (see kanbus-2c3584/kanbus-3d5ae7 in the
; WLED-project Kanbus tracker for the full investigation). Instead, full mbedTLS client
; libraries -- built with SECP384R1/SECP521R1 curve support (modern CAs like Google's GTS
; Root R4 use P-384; CONFIG_MBEDTLS_CERTIFICATE_BUNDLE implicitly restricted curves to
; P-256-only, so it's left off here since setInsecure() doesn't need it anyway) -- are
; overlaid directly via install_mbedtls_tls_c3.py, mirroring seengreat_rgb_matrix_s3's
; approach for the same Tasmota-strips-TLS problem but without ever triggering the broken
; rebuild path.
[env:esp32c3dev]
extends = esp32c3
board_build.partitions = ${esp32.big_partitions}
board_build.flash_mode = dio
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
custom_usermods = online_lookup
extra_scripts =
  ${scripts_defaults.extra_scripts}
  pre:scripts/install_mbedtls_tls_c3.py
build_flags =
  ${common.build_flags}
  ${esp32c3.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32-C3\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D LOLIN_WIFI_FIX
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USERMOD_ONLINE_LOOKUP
