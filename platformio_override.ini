[platformio]
default_envs = seengreat_rgb_matrix_s3

[env:seengreat_rgb_matrix_s3]
extends = env:esp32s3dev_16MB_opi
upload_speed = 115200
; Keep WLED scripts (dynarray usermod registration, etc.) and overlay mbedTLS libs.
extra_scripts =
  ${scripts_defaults.extra_scripts}
  pre:scripts/install_mbedtls_tls.py
; Keep a single WLED_RELEASE_NAME (from parent env). Redefining breaks hybrid IDF
; rebuilds that compile wpa_supplicant with -Werror.
build_flags = ${env:esp32s3dev_16MB_opi.build_flags} ${hub75.build_flags} ${hub75.s3_build_flags} ${hub75.i2s_disable_flags}
  -D WLED_DEBUG
  -D RLYPIN=-1
  -D LEDPIN=-1
  -D IRPIN=-1
  -D AUDIOPIN=-1
  -D USERMOD_MATRIX_DISPLAY
  -D SEENGREAT_RGB_MATRIX_S3_PINOUT
lib_deps = 
  ${esp32s3.lib_deps}
  ${hub75.lib_deps}
  knolleary/PubSubClient@^2.8
; Re-enable mbedTLS client TLS + PEM parse (Tasmota stubs omit both) for AWS IoT MQTT.
custom_sdkconfig =
  '# CONFIG_MBEDTLS_TLS_DISABLED is not set'
  CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  CONFIG_MBEDTLS_PEM_PARSE_C=y
